<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspective Ads Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container"></div>

    <div id="debug-info">
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Viewer X(cm): <span id="val-x">0</span></p>
        <p>Viewer Y(cm): <span id="val-y">0</span></p>
        <p>Viewer Z(cm): <span id="val-z">0</span></p>
        <p>Mode: <span id="projection-mode">OFF-AXIS</span></p>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Projection helper -->
    <script src="js/projection.js"></script>

    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
